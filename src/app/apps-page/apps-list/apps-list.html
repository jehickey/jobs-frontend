<div class="app-list">
    <div class="app-item" *ngFor="let app of applications()" (click)="select(app)"
        [class.selected]="app.id === selectedId" [style.background]="app.color">
        <p class="item-title">{{ app.position || '(no title)' }}</p>
        <p class="item-status">{{ app.status }}</p>
    </div>
</div>
