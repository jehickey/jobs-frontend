<div class="wrapper">
    <div class="card">
        <div class="right">
            <button type="button" (click)="onCreate()">Create new Application</button>
        </div>

        @if (data().id > 0) {
        <form [formGroup]="form">

            <div class="appTitleBar" [style.background]="statusColor">
                <div class="left">
                    <div>
                        <app-field class="title-field" type="text" controlName="position"
                            [backgroundColor]="statusColor"></app-field>
                        <app-field type="select" label="" controlName="statusId" listEndpoint="/statuses"
                            [allowIncrement]="true" (colorChange)="onStatusColor($event)"></app-field>
                    </div>
                </div>
                <div class="right">
                    <div class="icon"></div>
                    <div class="icon"></div>
                    <div class="icon"></div>
                </div>
            </div>



            <div>
                <app-field type="select" label="Organization" controlName="organization"
                    listEndpoint="/organizations"></app-field>
            </div>


            <div class="rightstack">
                <div>#{{data().id}} Created: {{data().dateApplied}}</div>
                <div>Last Updated: {{data().dateApplied}}</div>
            </div>


            <div>
                <label>Date Applied</label>
                <input name="email" formControlName="dateApplied" [class.pending]="pending['dateApplied']"
                    [class.error]="error['dateApplied']" />

            </div>
            <div>
                <label>Last Response</label>
                <input name="email" formControlName="lastResponse" [class.pending]="pending['lastResponse']"
                    [class.error]="error['lastResponse']" />

            </div>
            <div>
                <app-field type="text" label="Application URL" controlName="url"></app-field>
            </div>
            <div>
                <app-field type="text" label="Url Login Name" controlName="siteUser"></app-field>
            </div>
            <div>
                <label>Source</label>
                <select formControlName="sourceId">
                    <option>Alpha</option>
                    <option>Beta</option>
                </select>
            </div>
            <div>
                <app-field type="textarea" label="Job Posting" controlName="jobPosting"></app-field>
            </div>

            <div>
                <app-field type="textarea" label="Notes" controlName="notes"></app-field>
            </div>

        </form>


        <button onclick="onCreate()">Delete this Application</button>
        }
    </div>
</div>
